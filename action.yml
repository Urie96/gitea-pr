name: Gitea PR
description: >-
  Open (or reuse) a pull request on Gitea/Forgejo and schedule it to be merged
  as soon as the required checks pass. Idempotent and safe to run on a schedule:
  a missing head branch, an already open PR, a PR that is already scheduled and
  a branch without commits against the base are all normal no-ops.

inputs:
  token:
    description: >-
      Personal access token of a real user or bot account. Do NOT pass
      secrets.GITEA_TOKEN / github.token: the job token acts as `gitea-actions`
      and events caused by it never trigger workflows, so the required check
      would never run and the auto-merge would wait forever.
    required: true
  head:
    description: Source branch. It must already be pushed to the remote.
    required: true
  base:
    description: Target branch.
    required: false
    default: main
  title:
    description: Pull request title.
    required: true
  body:
    description: Pull request description.
    required: false
    default: ''
  labels:
    description: >-
      Label names to set on the pull request, separated by commas or newlines
      (use a block scalar for one label per line). Labels that do not exist in
      the repository yet are created with `label-color`.
    required: false
    default: ''
  label-color:
    description: >-
      Color of labels created for `labels`, as `#rrggbb`.
    required: false
    default: '#ededed'
  merge-method:
    description: >-
      merge, squash, rebase, rebase-merge, or `default` to use the repository
      default. `fast-forward-only` is not supported: it ignores
      merge_when_checks_succeed on some Gitea versions.
    required: false
    default: default
  auto-merge:
    description: Schedule the merge to happen once the required checks pass.
    required: false
    default: 'true'
  delete-branch:
    description: Delete the source branch after the merge.
    required: false
    default: 'true'
  server-url:
    description: Gitea base URL. Defaults to ${{ github.server_url }}.
    required: false
    default: ''
  repository:
    description: Repository as owner/name. Defaults to ${{ github.repository }}.
    required: false
    default: ''

outputs:
  number:
    description: Pull request number.
    value: ${{ steps.pr.outputs.number }}
  url:
    description: Pull request URL.
    value: ${{ steps.pr.outputs.url }}

runs:
  using: composite
  steps:
    - id: pr
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_LABELS: ${{ inputs.labels }}
        INPUT_LABEL_COLOR: ${{ inputs.label-color }}
        INPUT_MERGE_METHOD: ${{ inputs.merge-method }}
        INPUT_AUTO_MERGE: ${{ inputs.auto-merge }}
        INPUT_DELETE_BRANCH: ${{ inputs.delete-branch }}
        INPUT_SERVER_URL: ${{ inputs.server-url }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
      run: node "${GITHUB_ACTION_PATH}/index.js"
